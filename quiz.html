<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Exámenes - Academia Oposiciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .contenedor { max-width: 800px; margin: auto; }
        h1 { color: #0f172a; border-bottom: 3px solid #3b82f6; padding-bottom: 10px; margin-bottom: 5px; }
        .barra-usuario {
            display: flex; justify-content: space-between; align-items: center;
            background: #e2e8f0; padding: 8px 15px; border-radius: 6px;
            font-size: 14px; font-weight: 500; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .grupo-botones-barra { display: flex; align-items: center; gap: 8px; }
        .btn-volver {
            display: inline-block; padding: 4px 12px; background-color: #3b82f6; color: white;
            text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; transition: background 0.2s;
        }
        .btn-volver:hover { background-color: #2563eb; }
        .btn-cerrar { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .subtitulo { color: #64748b; margin-bottom: 25px; }
        .panel-configuracion {
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 25px; display: flex; flex-direction: column; gap: 20px;
        }
        .fila-config { display: flex; flex-wrap: wrap; gap: 20px; }
        .seccion-config { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 8px; }
        .seccion-config label { font-size: 13px; font-weight: bold; color: #475569; text-transform: uppercase; }
        select { padding: 12px 15px; border-radius: 8px; border: 2px solid #cbd5e1; background-color: #fff; font-weight: bold; color: #334155; outline: none; width: 100%; font-size: 14px; cursor: pointer; }
        .btn-generar-test { background-color: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .tarjeta-pregunta { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 20px; }
        .enunciado { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
        .opcion { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .opcion.correcta { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d; font-weight: 600; }
        .opcion.incorrecta { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .btn-corregir { background-color: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .resultado-final { margin-top: 25px; padding: 20px; border-radius: 10px; text-align: center; font-size: 20px; font-weight: bold; display: none; }
        .btn-limpiar { background-color: #64748b; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; display: none; }
        .btn-limpiar:hover { background-color: #475569; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="barra-usuario">
            <span>👋 Alumno: <strong id="nombre-alumno">Invitado</strong></span>
            <div class="grupo-botones-barra">
                <a href="panel.html" class="btn-volver">⬅ Volver al Panel</a>
                <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>

        <h1>🧠 Generador de Tests Avanzado</h1>
        <div class="subtitulo">Configura tu sesión de estudio. Tu progreso se guardará automáticamente.</div>

        <div class="panel-configuracion">
            <div class="fila-config">
                <div class="seccion-config">
                    <label for="select-cantidad">1. Cantidad de preguntas</label>
                    <select id="select-cantidad">
                        <option value="10">📝 10 Preguntas</option>
                        <option value="20" selected>📝 20 Preguntas</option>
                        <option value="30">📝 30 Preguntas</option>
                        <option value="40">🔥 40 Preguntas</option>
                    </select>
                </div>
                <div class="seccion-config">
                    <label for="select-tema">2. Selecciona la Materia o Ley</label>
                    <select id="select-tema"></select>
                </div>
            </div>
            <button type="button" class="btn-generar-test" onclick="procesarLanzamientoExamen()">
                🚀 Iniciar Cuestionario Personalizado
            </button>
        </div>

        <form id="formulario-examen" onsubmit="corregirExamen(event)">
            <div id="contenedor-preguntas"></div>
            <button type="submit" class="btn-corregir" id="btn-enviar" style="display: none;">📊 Finalizar y Corregir Examen</button>
        </form>

        <div id="cuadro-resultado" class="resultado-final"></div>
        <button type="button" id="btn-limpiar-pantalla" class="btn-limpiar" onclick="limpiarPantallaYNuevoTest()">🧹 Limpiar y Nuevo Test</button>
    </div>

    <script>
        const datosUsuario = JSON.parse(localStorage.getItem('usuario_logeado'));
        if (!datosUsuario) { window.location.href = 'login.html'; } 
        else { document.getElementById('nombre-alumno').innerText = datosUsuario.nombre; }

        function cerrarSesion() { localStorage.removeItem('usuario_logeado'); window.location.href = 'login.html'; }

        let todasLasPreguntasBD = [];
        let preguntasCargadasExamen = [];

        function desordenarArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function inicializarEcosistema() {
            try {
                const res = await fetch('https://mi-academia-tests.onrender.com/tests');
                todasLasPreguntasBD = await res.json();
                const selectTema = document.getElementById('select-tema');
                const temasUnicos = [...new Set(todasLasPreguntasBD.map(p => p.tema))];
                let opcionesHTML = `<option value="simulacro">⚡ Simulacro General (Mezcla de todo)</option>`;
                temasUnicos.forEach(tema => { if(tema) opcionesHTML += `<option value="${tema}">📚 ${tema}</option>`; });
                selectTema.innerHTML = opcionesHTML;
            } catch (error) { console.error("Error al arrancar el simulador:", error); }
        }

        function procesarLanzamientoExamen() {
            document.getElementById('cuadro-resultado').style.display = "none";
            document.getElementById('btn-limpiar-pantalla').style.display = "none";
            document.querySelectorAll('.justificacion-bloque').forEach(el => el.remove());

            const cantidadLimite = parseInt(document.getElementById('select-cantidad').value);
            const temaSeleccionado = document.getElementById('select-tema').value;
            
            let poolPreguntas = temaSeleccionado === 'simulacro' ? [...todasLasPreguntasBD] : todasLasPreguntasBD.filter(p => p.tema === temaSeleccionado);
            desordenarArray(poolPreguntas);
            let preguntasRecortadas = poolPreguntas.slice(0, cantidadLimite);
            
            preguntasCargadasExamen = preguntasRecortadas.map(p => {
                let opciones = [
                    { letraOriginal: 'A', texto: p.opcion_a }, { letraOriginal: 'B', texto: p.opcion_b },
                    { letraOriginal: 'C', texto: p.opcion_c }, { letraOriginal: 'D', texto: p.opcion_d }
                ];
                desordenarArray(opciones);
                return { id: p.id, tema: p.tema, enunciado: p.enunciado, correctaOriginal: p.correcta, justificacion: p.justificacion || "Fundamento jurídico no especificado.", opcionesMezcladas: opciones };
            });
            
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = "";
            const letrasVisuales = ['A', 'B', 'C', 'D'];
            
            preguntasCargadasExamen.forEach((p, index) => {
                const div = document.createElement('div'); div.className = 'tarjeta-pregunta';
                let opcionesHTML = "";
                p.opcionesMezcladas.forEach((op, i) => {
                    opcionesHTML += `
                        <label class="opcion" id="opt-${p.id}-${letrasVisuales[i]}">
                            <input type="radio" name="pregunta-${p.id}" value="${op.letraOriginal}" required> 
                            <strong>${letrasVisuales[i]})</strong> ${op.texto}
                        </label>`;
                });
                div.innerHTML = `<div class="enunciado">${index + 1}. ${p.enunciado}</div>${opcionesHTML}`;
                contenedor.appendChild(div);
            });
            document.getElementById('btn-enviar').style.display = "block";
        }

        function corregirExamen(event) {
            event.preventDefault();
            let aciertos = 0;
            const total = preguntasCargadasExamen.length;
            const temaSeleccionado = document.getElementById('select-tema').value;
            document.querySelectorAll('.justificacion-bloque').forEach(el => el.remove());

            preguntasCargadasExamen.forEach(p => {
                const seleccionada = document.querySelector(`input[name="pregunta-${p.id}"]:checked`);
                const respuestaUsuario = seleccionada ? seleccionada.value : null;
                const respuestaCorrecta = p.correctaOriginal;
                const letrasVisuales = ['A', 'B', 'C', 'D'];
                
                p.opcionesMezcladas.forEach((op, i) => {
                    const elementoFila = document.getElementById(`opt-${p.id}-${letrasVisuales[i]}`);
                    if (elementoFila) {
                        if (op.letraOriginal === respuestaCorrecta) elementoFila.classList.add('correcta');
                        if (respuestaUsuario && op.letraOriginal === respuestaUsuario && respuestaUsuario !== respuestaCorrecta) elementoFila.classList.add('incorrecta');
                    }
                });
                
                if (respuestaUsuario === respuestaCorrecta) aciertos++;
                
                const opcionA = document.getElementById(`opt-${p.id}-A`);
                if (opcionA) {
                    const tarjetaContenedora = opcionA.closest('.tarjeta-pregunta');
                    if (tarjetaContenedora) {
                        const divJust = document.createElement('div');
                        divJust.className = "justificacion-bloque"; divJust.style.marginTop = "15px"; divJust.style.padding = "15px";
                        divJust.style.backgroundColor = "#eff6ff"; divJust.style.borderLeft = "4px solid #3b82f6";
                        divJust.style.borderRadius = "6px"; divJust.style.fontSize = "14px"; divJust.style.color = "#1e40af";
                        divJust.innerHTML = `<strong>⚖️ Fundamento Jurídico:</strong> ${p.justificacion}`;
                        tarjetaContenedora.appendChild(divJust);
                    }
                }
            });
            
            const nota = ((aciertos / total) * 10).toFixed(2);
            const cuadroResultado = document.getElementById('cuadro-resultado');
            cuadroResultado.style.display = "block";
            
            if (nota >= 5) {
                cuadroResultado.style.backgroundColor = "#dcfce7"; cuadroResultado.style.color = "#166534";
                cuadroResultado.innerHTML = `🎉 ¡Examen Terminado! Nota: ${nota}/10`;
            } else {
                cuadroResultado.style.backgroundColor = "#fee2e2"; cuadroResultado.style.color = "#991b1b";
                cuadroResultado.innerHTML = `❌ ¡Examen Terminado! Nota: ${nota}/10.`;
            }

            document.getElementById('btn-enviar').style.display = "none";
            document.getElementById('btn-limpiar-pantalla').style.display = "block";

            const cargaHistorial = { usuario_id: datosUsuario.id, tema: temaSeleccionado === 'simulacro' ? 'Simulacro General' : temaSeleccionado, aciertos: aciertos, total_preguntas: total, nota: parseFloat(nota) };

            // URL Unificada para guardar progreso sin errores
            fetch('https://mi-academia-tests.onrender.com/historial', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cargaHistorial)
            }).then(r => r.json()).catch(e => console.error(e));

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function limpiarPantallaYNuevoTest() {
            document.getElementById('cuadro-resultado').style.display = "none";
            document.getElementById('btn-limpiar-pantalla').style.display = "none";
            document.getElementById('contenedor-preguntas').innerHTML = "";
            document.querySelectorAll('.justificacion-bloque').forEach(el => el.remove());
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        inicializarEcosistema();
    </script>
</body>
</html>
