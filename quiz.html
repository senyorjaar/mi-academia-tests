<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tests - Academia Oposiciones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 20px;
        }
        .contenedor {
            max-width: 900px;
            margin: 0 auto;
        }
        .barra-nav {
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .btn-nav {
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-boib { background-color: #0284c7; color: white; }
        .btn-logout { background-color: #ef4444; color: white; }

        .tarjeta {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 15px; color: #1e293b; }

        .selector-fila {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .campo-sel {
            flex: 1;
            min-width: 200px;
        }
        .campo-sel label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #475569;
        }
        .campo-sel select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            background: white;
            font-size: 14px;
        }
        .btn-iniciar {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        .btn-iniciar:hover { background-color: #1d4ed8; }

        /* PREGUNTAS */
        .bloque-pregunta {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f8fafc;
        }
        .enunciado {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1e293b;
        }
        .opcion-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .opcion-btn:hover { background-color: #e2e8f0; }
        .opcion-correcta { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: 700; }
        .opcion-erronea { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }

        .justificacion {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
            font-size: 13px;
            color: #1e40af;
        }

        .resultado-box {
            display: none;
            text-align: center;
            padding: 30px;
            background-color: #e0f2fe;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="barra-nav">
        <strong>📝 Simulador de Exámenes de Oposición</strong>
        <div style="display: flex; gap: 10px;">
            <a href="panel.html" class="btn-nav btn-boib">📋 Ir al Buscador BOIB</a>
            <a href="/api/logout" class="btn-nav btn-logout">🚪 Salir</a>
        </div>
    </div>

    <!-- CONFIGURADOR DEL TEST -->
    <div class="tarjeta" id="zonaConfig">
        <h2>⚙️ Configuración del Test</h2>
        <div class="selector-fila">
            <div class="campo-sel">
                <label>Categoría / Oficio:</label>
                <select id="selCategoria" onchange="cargarExamenes()">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
            <div class="campo-sel">
                <label>Examen / Archivo:</label>
                <select id="selExamen">
                    <option value="">Todos los archivos</option>
                </select>
            </div>
            <div class="campo-sel">
                <label>Volumen de Preguntas:</label>
                <select id="selCantidad">
                    <option value="10">10 preguntas</option>
                    <option value="20">20 preguntas</option>
                    <option value="completo">Examen completo</option>
                </select>
            </div>
        </div>
        <button onclick="comenzarTest()" class="btn-iniciar">Empezar Examen</button>
    </div>

    <!-- RESOLUCIÓN DEL TEST -->
    <div class="tarjeta" id="zonaPreguntas" style="display: none;">
        <h2 id="tituloTest">Examen en Curso</h2>
        <div id="contenedorPreguntas"></div>
        <div class="resultado-box" id="cajaResultado">
            <h3 id="lblNota" style="font-size: 24px; margin-bottom: 10px;"></h3>
            <p id="lblDetalle"></p>
            <button onclick="location.reload()" class="btn-iniciar" style="width: auto; margin-top: 15px;">Hacer Otro Test</button>
        </div>
    </div>
</div>

<script>
    let preguntasCargadas = [];
    let respuestasUsuario = {};

    async function inicializarSelectores() {
        try {
            const res = await fetch('/api/quiz/categorias');
            if (res.status === 401) {
                window.location.href = '/login.html?redirect=/quiz.html';
                return;
            }
            const data = await res.json();
            const selCat = document.getElementById('selCategoria');
            (data.categorias || []).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                selCat.appendChild(opt);
            });
            cargarExamenes();
        } catch (e) {
            console.error(e);
        }
    }

    async function cargarExamenes() {
        const cat = document.getElementById('selCategoria').value;
        const selEx = document.getElementById('selExamen');
        selEx.innerHTML = '<option value="">Todos los archivos</option>';
        try {
            const res = await fetch('/api/quiz/examenes?tema=' + encodeURIComponent(cat));
            const data = await res.json();
            (data.examenes || []).forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex;
                opt.textContent = ex;
                selEx.appendChild(opt);
            });
        } catch (e) {
            console.error(e);
        }
    }

    async function comenzarTest() {
        const tema = document.getElementById('selCategoria').value;
        const examen = document.getElementById('selExamen').value;
        const cantidad = document.getElementById('selCantidad').value;

        const params = new URLSearchParams({
            tema: tema,
            examen: examen,
            cantidad: cantidad === 'completo' ? 9999 : cantidad
        });

        try {
            const res = await fetch('/api/quiz/preguntas?' + params.toString());
            const data = await res.json();
            preguntasCargadas = data.preguntas || [];

            if (preguntasCargadas.length === 0) {
                alert("No hay preguntas disponibles con los filtros elegidos.");
                return;
            }

            document.getElementById('zonaConfig').style.display = 'none';
            document.getElementById('zonaPreguntas').style.display = 'block';
            document.getElementById('tituloTest').textContent = `Examen: ${tema || 'General'} (${preguntasCargadas.length} preguntas)`;

            renderizarPreguntas();
        } catch (e) {
            alert("Error al cargar las preguntas.");
        }
    }

    function renderizarPreguntas() {
        const div = document.getElementById('contenedorPreguntas');
        div.innerHTML = "";

        preguntasCargadas.forEach((p, idx) => {
            div.innerHTML += `
                <div class="bloque-pregunta" id="bloque-${idx}">
                    <div class="enunciado">${idx + 1}. ${p.enunciado}</div>
                    <button class="opcion-btn" onclick="responder(${idx}, 'A', this)">A) ${p.opcion_a}</button>
                    <button class="opcion-btn" onclick="responder(${idx}, 'B', this)">B) ${p.opcion_b}</button>
                    <button class="opcion-btn" onclick="responder(${idx}, 'C', this)">C) ${p.opcion_c}</button>
                    <button class="opcion-btn" onclick="responder(${idx}, 'D', this)">D) ${p.opcion_d}</button>
                    <div class="justificacion" id="just-${idx}">
                        <strong>⚖️ Justificación Normativa:</strong><br>${p.justificacion}
                    </div>
                </div>
            `;
        });
    }

    function responder(idxPregunta, opcionElegida, btnElem) {
        if (respuestasUsuario[idxPregunta] !== undefined) return; // Ya respondida

        respuestasUsuario[idxPregunta] = opcionElegida;
        const pregunta = preguntasCargadas[idxPregunta];
        const bloque = document.getElementById(`bloque-${idxPregunta}`);
        const botones = bloque.querySelectorAll('.opcion-btn');
        const correcta = pregunta.correcta.trim().toUpperCase();

        botones.forEach(b => {
            b.disabled = true;
            if (b.textContent.startsWith(correcta + ")")) {
                b.classList.add('opcion-correcta');
            }
        });

        if (opcionElegida !== correcta) {
            btnElem.classList.add('opcion-erronea');
        }

        // Mostrar justificación normativa
        const just = document.getElementById(`just-${idxPregunta}`);
        if (just) just.style.display = 'block';

        // Comprobar si ha terminado todas las preguntas
        if (Object.keys(respuestasUsuario).length === preguntasCargadas.length) {
            evaluarFinal();
        }
    }

    async function evaluarFinal() {
        let aciertos = 0;
        preguntasCargadas.forEach((p, idx) => {
            if (respuestasUsuario[idx] === p.correcta.trim().toUpperCase()) aciertos++;
        });

        const total = preguntasCargadas.length;
        const nota = ((aciertos / total) * 10).toFixed(2);

        const caja = document.getElementById('cajaResultado');
        caja.style.display = 'block';
        document.getElementById('lblNota').textContent = `Nota Final: ${nota} / 10`;
        document.getElementById('lblDetalle').textContent = `Has acertado ${aciertos} de ${total} preguntas.`;

        // Guardar resultado en el historial
        const tema = document.getElementById('selCategoria').value || "General";
        try {
            await fetch('/api/quiz/guardar_resultado', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tema, aciertos, total_preguntas: total, nota: parseFloat(nota) })
            });
        } catch (e) {
            console.error("No se pudo guardar en historial", e);
        }
    }

    document.addEventListener('DOMContentLoaded', inicializarSelectores);
</script>

</body>
</html>
