<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Buscador BOIB y Oposiciones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 20px;
        }
        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* BARRA SUPERIOR */
        .barra-nav {
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .acciones-nav {
            display: flex;
            gap: 12px;
        }
        .btn-nav {
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-test { background-color: #2563eb; color: #ffffff; }
        .btn-test:hover { background-color: #1d4ed8; }
        .btn-sync { background-color: #0284c7; color: #ffffff; }
        .btn-sync:hover { background-color: #0369a1; }
        .btn-sync:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-logout { background-color: #ef4444; color: #ffffff; }
        .btn-logout:hover { background-color: #dc2626; }

        /* SECCIÓN PRINCIPAL */
        .tarjeta-panel {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .cabecera-seccion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .cabecera-seccion h2 {
            font-size: 22px;
            color: #1e293b;
        }
        .contador-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }

        /* BUSCADOR */
        .caja-busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-buscar {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .input-buscar:focus { border-color: #2563eb; }
        .btn-buscar {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-buscar:hover { background-color: #059669; }

        /* FILTROS */
        .zona-filtros {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .linea-filtro {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .etiqueta-f {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            min-width: 80px;
        }
        .btn-f {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-f:hover { border-color: #2563eb; color: #2563eb; }
        .btn-f.activo { background-color: #2563eb; color: #ffffff; border-color: #2563eb; }
        .btn-f-escala.activo { background-color: #0f172a; color: #ffffff; border-color: #0f172a; }

        /* TABLA */
        .tabla-scroll {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background-color: #f8fafc;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 14px;
            font-size: 13px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tr:hover td { background-color: #f8fafc; }
        
        .badge-escala {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            background-color: #e2e8f0;
            color: #1e293b;
        }
        .badge-AP { background-color: #ffedd5; color: #9a3412; }
        .badge-C2 { background-color: #fef9c3; color: #854d0e; }
        .badge-C1 { background-color: #dcfce7; color: #166534; }
        .badge-B  { background-color: #e0f2fe; color: #0369a1; }
        .badge-A2 { background-color: #e0e7ff; color: #3730a3; }
        .badge-A1 { background-color: #ede9fe; color: #5b21b6; }
        .badge-Laboral { background-color: #f3e8ff; color: #6b21a8; }

        .btn-link-boib {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }
        .btn-link-boib:hover { text-decoration: underline; }
        .btn-pdf {
            display: inline-block;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid #fca5a5;
        }
        .btn-pdf:hover { background-color: #ef4444; color: #ffffff; }

        .mensaje-aviso {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <!-- NAVEGACIÓN SUPERIOR -->
    <div class="barra-nav">
        <div class="logo-area">
            <span>🏛️</span> Academia Oposiciones
        </div>
        <div class="acciones-nav">
            <a href="quiz.html" class="btn-nav btn-test">📝 Ir al Simulador de Tests</a>
            <button onclick="sincronizarBOIB()" id="btnSync" class="btn-nav btn-sync">🔄 Actualizar Mes del BOIB</button>
            <a href="/api/logout" class="btn-nav btn-logout">🚪 Salir</a>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div class="tarjeta-panel">
        <div class="cabecera-seccion">
            <h2>📋 Monitor de Ofertas de Empleo Público (BOIB)</h2>
            <span class="contador-badge" id="lblContador">Cargando...</span>
        </div>

        <!-- BUSCADOR -->
        <div class="caja-busqueda">
            <input type="text" id="txtBuscar" class="input-buscar" placeholder="Filtrar por puesto o municipio (ej. Peón, Palma, Marratxí, Calvià...)" onkeyup="comprobarEnter(event)">
            <button onclick="cargarConvocatorias()" class="btn-buscar">Buscar</button>
        </div>

        <!-- FILTROS RÁPIDOS -->
        <div class="zona-filtros">
            <div class="linea-filtro">
                <span class="etiqueta-f">Ámbito:</span>
                <button class="btn-f activo" onclick="filtrarAmbito('todos', this)">Todos</button>
                <button class="btn-f" onclick="filtrarAmbito('Municipal', this)">Municipales</button>
                <button class="btn-f" onclick="filtrarAmbito('Insular', this)">Insulares</button>
                <button class="btn-f" onclick="filtrarAmbito('Autonómica', this)">Autonómicos</button>
            </div>
            <div class="linea-filtro">
                <span class="etiqueta-f">Escala:</span>
                <button class="btn-f btn-f-escala activo" onclick="filtrarEscala('TODAS', this)">Todas</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('AP', this)">AP (Peones / Servicios)</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('C2', this)">C2 (Oficiales / Auxiliares)</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('C1', this)">C1 (Administrativo / Policía)</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('B', this)">Grupo B</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('A2', this)">A2</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('A1', this)">A1</button>
                <button class="btn-f btn-f-escala" onclick="filtrarEscala('Laboral', this)">Laboral</button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th style="width: 42%;">Convocatoria / Puesto</th>
                        <th style="width: 20%;">Organismo Convocante</th>
                        <th style="width: 10%;">Ámbito</th>
                        <th style="width: 10%;">Escala</th>
                        <th style="width: 8%;">Fecha</th>
                        <th style="width: 10%;">Documentación</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <tr><td colspan="6" class="mensaje-aviso">Cargando convocatorias...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let ambitoActual = 'todos';
    let escalaActual = 'TODAS';

    async function cargarConvocatorias() {
        const tbody = document.getElementById('cuerpoTabla');
        const contador = document.getElementById('lblContador');
        tbody.innerHTML = `<tr><td colspan="6" class="mensaje-aviso">Consultando base de datos...</td></tr>`;

        try {
            const q = document.getElementById('txtBuscar').value.trim();
            const params = new URLSearchParams({
                dias: 365,
                ambito: ambitoActual,
                escala: escalaActual
            });
            if (q) params.append('q', q);

            const res = await fetch('/api/buscar?' + params.toString());
            if (res.status === 401) {
                window.location.href = '/login.html?redirect=/panel.html';
                return;
            }

            const data = await res.json();
            const lista = data.datos || [];
            contador.textContent = `${lista.length} ${lista.length === 1 ? 'convocatoria' : 'convocatorias'}`;

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="mensaje-aviso">ℹ️ No hay convocatorias que coincidan con los filtros aplicados.</td></tr>`;
                return;
            }

            let filasHtml = "";
            lista.forEach(item => {
                const puesto = item.titulo || "Convocatoria pública";
                const org = item.organismo || "Administración";
                const amb = item.ambito || "Municipal";
                const esc = item.escala || "S/E";
                const fecha = item.fecha || "-";
                const urlHtml = item.enlace || "#";
                const urlPdf = item.enlace_pdf || "";

                let pdfBoton = "";
                if (urlPdf && urlPdf !== "#") {
                    pdfBoton = `<a href="${urlPdf}" target="_blank" class="btn-pdf">📄 PDF</a>`;
                }

                filasHtml += `
                    <tr>
                        <td><strong>${puesto}</strong></td>
                        <td>${org}</td>
                        <td>${amb}</td>
                        <td><span class="badge-escala badge-${esc}">${esc}</span></td>
                        <td>${fecha}</td>
                        <td>
                            <a href="${urlHtml}" target="_blank" class="btn-link-boib">🔗 Ver BOIB</a>
                            ${pdfBoton}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = filasHtml;

        } catch (e) {
            console.error("Error al cargar datos:", e);
            tbody.innerHTML = `<tr><td colspan="6" class="mensaje-aviso" style="color: #dc2626;">⚠️ Error al obtener los datos del servidor.</td></tr>`;
            contador.textContent = "0 convocatorias";
        }
    }

    async function sincronizarBOIB() {
        const btn = document.getElementById('btnSync');
        btn.disabled = true;
        btn.textContent = "⏳ Escaneando BOIB...";

        try {
            const res = await fetch('/api/actualizar_boib', { method: 'POST' });
            if (res.status === 401) {
                window.location.href = '/login.html?redirect=/panel.html';
                return;
            }
            const data = await res.json();
            alert(data.mensaje || "Actualización completada.");
            cargarConvocatorias();
        } catch (e) {
            alert("❌ Error al comunicar con el escaneador.");
        } finally {
            btn.disabled = false;
            btn.textContent = "🔄 Actualizar Mes del BOIB";
        }
    }

    function filtrarAmbito(ambito, btn) {
        document.querySelectorAll('.linea-filtro:first-child .btn-f').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        ambitoActual = ambito;
        cargarConvocatorias();
    }

    function filtrarEscala(escala, btn) {
        document.querySelectorAll('.btn-f-escala').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        escalaActual = escala;
        cargarConvocatorias();
    }

    function comprobarEnter(e) {
        if (e.key === "Enter") cargarConvocatorias();
    }

    document.addEventListener('DOMContentLoaded', cargarConvocatorias);
</script>

</body>
</html>
