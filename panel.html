<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Oposiciones - Academia</title>
    <style>
        /* =================================================================
           ESTILOS GENERALES Y MAQUETACIÓN
           ================================================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f1f5f9; /* Gris claro de fondo uniforme */
            color: #1e293b;
        }
        .contenedor {
            max-width: 1000px; /* Un poco más ancho para la tabla de datos */
            margin: auto;
        }
        h1 {
            color: #0f172a;
            border-bottom: 3px solid #3b82f6; /* Línea decorativa azul */
            padding-bottom: 10px;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitulo {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* =================================================================
           BOTONES DE FILTRADO (Panel superior)
           ================================================================= */
        .bloque-filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-filtro {
            background-color: white;
            color: #475569;
            border: 2px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-filtro:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        /* Clase activa que resalta el filtro seleccionado actualmente */
        .btn-filtro.activo {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }

        /* =================================================================
           MANTENIMIENTO: NUEVA CAJA DE BÚSQUEDA POR TEXTO DIRECTO
           ================================================================= */
        .bloque-busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-texto {
            flex: 1;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .input-texto:focus {
            border-color: #3b82f6;
        }
        .btn-buscar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-buscar:active {
            background-color: #218838;
        }

        /* =================================================================
           ESTILOS DE LA TABLA DE PROCESOS
           ================================================================= */
        table {
            width: 100%;
            border-collapse: collapse; /* Une los bordes de las celdas */
            background: white;
            border-radius: 12px;
            overflow: hidden; /* Asegura que los bordes redondeados funcionen */
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 30px;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase; /* Encabezados en mayúsculas */
        }
        tr:last-child td {
            border-bottom: none; /* Quita la línea al último registro */
        }
        tr:hover td {
            background-color: #f8fafc; /* Efecto iluminación al pasar el ratón */
        }

        /* Etiquetas visuales de colores (Badges) según el tipo de administración */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-municipal { background-color: #ffe4e6; color: #9f1239; } /* Rosa / Rojo */
        .badge-insular { background-color: #fef3c7; color: #92400e; }   /* Amarillo / Marrón */
        .badge-autonomica { background-color: #dbeafe; color: #1e40af; } /* Azul / Oscuro */

        /* Estilo para los enlaces de descarga directa */
        .enlace-boib {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }
        .enlace-boib:hover {
            text-decoration: underline;
        }
        
        /* Mensaje de alerta en caso de que la tabla esté vacía */
        .sin-resultados {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>📋 Buscador de Ofertas de Empleo Público</h1>
        <div class="subtitulo">Monitoreo automatizado de plazas y edictos oficiales publicados en el BOIB.</div>

        <!-- MANTENIMIENTO: Barra para buscar por palabras clave específicas en movilidad -->
        <div class="bloque-busqueda">
            <input type="text" id="input-keyword" class="input-texto" placeholder="Escribe un término (Ej: Peón, Marratxí, Alaró...)">
            <button onclick="buscarPorPalabraClave()" class="btn-buscar">Buscar</button>
        </div>

        <!-- Panel de filtrado por ámbitos de la administración original -->
        <div class="bloque-filtros">
            <button class="btn-filtro activo" onclick="filtrarProcesos('todos', this)">🌍 Ver Todo</button>
            <button class="btn-filtro" onclick="filtrarProcesos('municipal', this)">🏙️ Municipales (Ayuntamientos)</button>
            <button class="btn-filtro" onclick="filtrarProcesos('insular', this)">🚗 Insulares (Consells)</button>
            <button class="btn-filtro" onclick="filtrarProcesos('autonomica', this)">🏛️ Autonómicos (Govern / CAIB)</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 45%;">Puesto / Categoría</th>
                    <th style="width: 25%;">Organismo / Ente</th>
                    <th style="width: 15%;">Ámbito</th>
                    <th style="width: 15%;">Enlace</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <!-- Las celdas se inyectan dinámicamente aquí -->
            </tbody>
        </table>
    </div>

    <script>
        // -----------------------------------------------------------------
        // MANTENIMIENTO: CARGAR OPOSICIONES DESDE EL SERVIDOR DE RENDER
        // -----------------------------------------------------------------
        async function cargarOposiciones(tipoFiltro = 'todos', terminoKeyword = '') {
            const cuerpoTabla = document.getElementById('tabla-cuerpo');
            cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados">Consultando base de datos en tiempo real...</td></tr>`;
            
            try {
                // Cambiado el endpoint local por tu URL global de Render definitiva
                let url = 'https://mi-academia-tests.onrender.com/buscar-convocatorias';
                
                // Añadimos los parámetros estructurados si el usuario filtra o busca texto
                let parametros = [];
                if (terminoKeyword !== '') {
                    parametros.push(`termino=${encodeURIComponent(terminoKeyword)}`);
                }
                if (tipoFiltro !== 'todos') {
                    parametros.push(`tipo=${encodeURIComponent(tipoFiltro)}`);
                }
                
                if (parametros.length > 0) {
                    url += '?' + parametros.join('&');
                }

                const respuesta = await fetch(url);
                const resultado = await respuesta.json();

                // Control: Verificar si la respuesta fue exitosa y trae datos
                if (resultado.estado !== "ok" || !resultado.datos || resultado.datos.length === 0) {
                    cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados">ℹ️ No se han registrado convocatorias con los criterios seleccionados.</td></tr>`;
                    return;
                }

                let htmlFilas = "";
                resultado.datos.forEach(proceso => {
                    // Mapeamos dinámicamente las etiquetas de los ámbitos institucionales originales
                    let claseBadge = "badge-municipal";
                    let nombreVisualBadge = "Municipal";

                    if (proceso.type === "insular" || proceso.ambito === "insular") {
                        claseBadge = "badge-insular";
                        nombreVisualBadge = "Insular";
                    } else if (proceso.type === "autonomica" || proceso.ambito === "autonomica") {
                        claseBadge = "badge-autonomica";
                        nombreVisualBadge = "Autonómica";
                    }

                    // Ensamblamos manteniendo las variables originales: puesto, ente, url
                    // Mantenimiento: Usamos campos alternativos por si varían entre tus bases de datos
                    const tituloPuesto = proceso.titulo || proceso.puesto || "Categoría sin especificar";
                    const organismoEnte = proceso.ente || proceso.organismo || "Ayuntamiento / Ente";
                    const enlaceDocumento = proceso.enlace || proceso.url || "#";

                    htmlFilas += `
                        <tr>
                            <td><strong>${tituloPuesto}</strong></td>
                            <td>${organismoEnte}</td>
                            <td><span class="badge ${claseBadge}">${nombreVisualBadge}</span></td>
                            <td><a href="${enlaceDocumento}" target="_blank" class="enlace-boib">🔗 Ver BOIB</a></td>
                        </tr>
                    `;
                });

                cuerpoTabla.innerHTML = htmlFilas;

            } catch (error) {
                console.error("Error al conectar con el módulo de procesos:", error);
                cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados" style="color:red;">⚠️ Error al conectar con el servidor en la nube de Render. Inténtalo de nuevo en unos instantes.</td></tr>`;
            }
        }

        // -----------------------------------------------------------------
        // MANTENIMIENTO: ACCIÓN DE BÚSQUEDA POR PALABRA CLAVE
        // -----------------------------------------------------------------
        function buscarPorPalabraClave() {
            const keyword = document.getElementById('input-keyword').value;
            // Al buscar texto, quitamos el estilo de activo de los botones de ámbito temporalmente
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            document.querySelector('.btn-filtro[onclick*="todos"]').classList.add('activo');
            
            cargarOposiciones('todos', keyword);
        }

        // -----------------------------------------------------------------
        // FUNCIÓN DE CONTROL: filtrarProcesos (Original con persistencia)
        // -----------------------------------------------------------------
        function filtrarProcesos(tipo, botonPulsado) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            botonPulsado.classList.add('activo');
            
            // Al pulsar un filtro de botón, limpiamos el campo de texto para no mezclar búsquedas
            document.getElementById('input-keyword').value = '';
            cargarOposiciones(tipo);
        }

        // Arranque inicial automático al cargar la pestaña en el dispositivo móvil
        cargarOposiciones();
    </script>
</body>
</html>
