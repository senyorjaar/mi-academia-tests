<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Oposiciones - Academia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .contenedor {
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            color: #0f172a;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitulo {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .barra-navegacion {
            display: flex;
            justify-content: space-between;
            background-color: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 25px;
        }
        .btn-nav-test {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-nav-test:hover {
            background-color: #2563eb;
        }
        .btn-nav-salir {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s;
        }
        .btn-nav-salir:hover {
            background-color: #dc2626;
        }
        .bloque-busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-texto {
            flex: 1;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .input-texto:focus {
            border-color: #3b82f6;
        }
        .btn-buscar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .bloque-filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-filtro {
            background-color: white;
            color: #475569;
            border: 2px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-filtro:hover { border-color: #3b82f6; color: #3b82f6; }
        .btn-filtro.activo { background-color: #3b82f6; color: white; border-color: #2563eb; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 30px;
        }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-weight: bold; font-size: 13px; text-transform: uppercase; }
        tr:hover td { background-color: #f8fafc; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .badge-municipal { background-color: #ffe4e6; color: #9f1239; }
        .badge-insular { background-color: #fef3c7; color: #92400e; }
        .badge-autonomica { background-color: #dbeafe; color: #1e40af; }
        .enlace-boib { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .enlace-boib:hover { text-decoration: underline; }
        .sin-resultados { text-align: center; padding: 40px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📋 Buscador de Ofertas de Empleo Público</h1>
        <div class="subtitulo">Monitoreo automatizado de plazas y edictos oficiales publicados en el BOIB.</div>

        <div class="barra-navegacion">
            <a href="quiz.html" class="btn-nav-test">📝 Ir a Zona de Tests</a>
            <a href="login.html" class="btn-nav-salir" onclick="localStorage.removeItem('usuario_logeado')">🚪 Cerrar Sesión</a>
        </div>

        <div class="bloque-busqueda">
            <input type="text" id="input-keyword" class="input-texto" placeholder="Escribe un término (Ej: Peón, Marratxí, Alaró...)">
            <button onclick="buscarPorPalabraClave()" class="btn-buscar">Buscar</button>
        </div>

        <div class="bloque-filtros">
            <button class="btn-filtro activo" onclick="filtrarProcesos('todos', this)">🌍 Ver Todo</button>
            <button class="btn-filtro" onclick="filtrarProcesos('municipal', this)">🏙️ Municipales</button>
            <button class="btn-filtro" onclick="filtrarProcesos('insular', this)">🚗 Insulares</button>
            <button class="btn-filtro" onclick="filtrarProcesos('autonomica', this)">🏛️ Autonómicos</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 45%;">Puesto / Categoría</th>
                    <th style="width: 25%;">Organismo / Ente</th>
                    <th style="width: 15%;">Ámbito</th>
                    <th style="width: 15%;">Enlace</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
        </table>
    </div>

    <script>
        async function cargarOposiciones(tipoFiltro = 'todos', terminoKeyword = '') {
            const cuerpoTabla = document.getElementById('tabla-cuerpo');
            cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados">Consultando base de datos en tiempo real...</td></tr>`;
            
            try {
                // Sincronizado a la URL estable sin '-1' igual que tu archivo login
                let url = 'https://mi-academia-tests.onrender.com/buscar-convocatorias';
                let parametros = [];
                if (terminoKeyword !== '') parametros.push(`termino=${encodeURIComponent(terminoKeyword)}`);
                if (tipoFiltro !== 'todos') parametros.push(`tipo=${encodeURIComponent(tipoFiltro)}`);
                if (parametros.length > 0) url += '?' + parametros.join('&');

                const respuesta = await fetch(url);
                const resultado = await respuesta.json();

                if (resultado.estado === "error" || !resultado.datos || resultado.datos.length === 0) {
                    cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados">ℹ️ No se han registrado convocatorias.</td></tr>`;
                    return;
                }

                let htmlFilas = "";
                resultado.datos.forEach(proceso => {
                    let claseBadge = "badge-municipal";
                    let nombreVisualBadge = "Municipal";
                    if (proceso.type === "insular" || proceso.ambito === "insular") {
                        claseBadge = "badge-insular"; nombreVisualBadge = "Insular";
                    } else if (proceso.type === "autonomica" || proceso.ambito === "autonomica") {
                        claseBadge = "badge-autonomica"; nombreVisualBadge = "Autonómica";
                    }

                    const tituloPuesto = proceso.puesto || proceso.titulo || "Categoría sin especificar";
                    const organismoEnte = proceso.ente || proceso.organismo || "Ayuntamiento / Ente";
                    const enlaceDocumento = proceso.url || proceso.enlace || "#";

                    htmlFilas += `
                        <tr>
                            <td><strong>${tituloPuesto}</strong></td>
                            <td>${organismoEnte}</td>
                            <td><span class="badge ${claseBadge}">${nombreVisualBadge}</span></td>
                            <td><a href="${enlaceDocumento}" target="_blank" class="enlace-boib">🔗 Ver BOIB</a></td>
                        </tr>
                    `;
                });
                cuerpoTabla.innerHTML = htmlFilas;
            } catch (error) {
                console.error(error);
                cuerpoTabla.innerHTML = `<tr><td colspan="4" class="sin-resultados" style="color:red;">⚠️ Error al conectar con el servidor. Inténtalo de nuevo.</td></tr>`;
            }
        }

        function buscarPorPalabraClave() {
            const keyword = document.getElementById('input-keyword').value;
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            document.querySelector('.btn-filtro[onclick*="todos"]').classList.add('activo');
            cargarOposiciones('todos', keyword);
        }

        function filtrarProcesos(tipo, botonPulsado) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            botonPulsado.classList.add('activo');
            document.getElementById('input-keyword').value = '';
            cargarOposiciones(tipo);
        }

        document.addEventListener("DOMContentLoaded", () => { cargarOposiciones(); });
    </script>
</body>
</html>
